<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>日翊點交系統 - 電子簽名版</title>
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
    <style>
        body { font-size: 11px; margin: 0; padding: 10px; font-family: "Microsoft JhengHei", sans-serif; }
        
        /* 網頁輸入介面樣式 */
        .no-print { background: #fdfdfd; padding: 15px; border-bottom: 2px solid #ccc; margin-bottom: 20px; }
        .form-row { margin-bottom: 10px; }
        .form-group { margin: 5px; display: inline-block; }
        
        /* 電子簽名板樣式 */
        .signature-wrapper {
            border: 1px solid #ccc;
            width: 300px;
            height: 150px;
            background: white;
            margin-top: 10px;
        }
        canvas { width: 100%; height: 100%; cursor: crosshair; }
        .sig-controls { margin-top: 5px; }

        /* A4 列印樣式 (依照原圖格子) */
        .print-area { width: 210mm; margin: 0 auto; }
        .record-box { 
            width: 100%; height: 55.4mm; border: 1px solid black; margin-bottom: 1.5mm; 
            display: grid; grid-template-columns: repeat(12, 1fr); grid-template-rows: repeat(12, 1fr);
            page-break-inside: avoid;
        }
        .cell { border: 0.5px solid #000; padding: 1px 3px; display: flex; align-items: center; }
        .cell-title { background: #eee; font-weight: bold; justify-content: center; }
        .col-span-2 { grid-column: span 2; }

        @media print {
            .no-print { display: none !important; } /* 列印時隱藏輸入表單與簽名板 */
            .record-box:nth-child(5n) { page-break-after: always; }
        }
    </style>
</head>
<body>

<div class="no-print">
    <h2>🚚 點交資料輸入 (含電子簽名)</h2>
    <form action="/add" method="post" id="entryForm">
        <div class="form-row">
            路線: <input type="text" name="route" required>
            車號: <input type="text" name="car_no">
            噸數: <select name="ton"><option>46噸</option><option>17噸</option></select>
        </div>

        <div class="form-row">
            紅箱: <input type="number" name="red_box" value="0" style="width:50px">
            棧板: <input type="number" name="pallet" value="0" style="width:50px">
        </div>

        <div class="form-group">
            <label>運務士電子簽名：</label>
            <div class="signature-wrapper">
                <canvas id="signature-pad"></canvas>
            </div>
            <div class="sig-controls">
                <button type="button" onclick="signaturePad.clear()">清除重簽</button>
            </div>
        </div>
        
        <input type="hidden" name="signature_data" id="signature_data">
        
        <br><br>
        <button type="submit" style="background: green; color: white; padding: 10px 20px;">確認輸入</button>
        <button type="button" onclick="window.print()" style="background: red; color: white; padding: 10px 20px;">🖨️ 列印 A4 (不含簽名)</button>
    </form>
</div>

<div class="print-area">
    {% for r in records %}
    <div class="record-box">
        <div class="cell cell-title col-span-2">配送起訖</div>
        <div class="cell cell-title col-span-2">車次</div>
        <div class="cell cell-title col-span-2">車號</div>
        <div class="cell cell-title col-span-2">噸數</div>
        <div class="cell cell-title col-span-2">進車時間</div>
        <div class="cell cell-title col-span-2">出車時間</div>
        
        <div class="cell col-span-2">{{ r.route }}</div>
        <div class="cell col-span-2">第 ______ 車</div>
        <div class="cell col-span-2">{{ r.car_no }}</div>
        <div class="cell col-span-2">{{ r.ton }}</div>
        <div class="cell col-span-2">______ : ______</div>
        <div class="cell col-span-2">______ : ______</div>

        <div class="cell">紅箱</div><div class="cell">{{ r.red_box }}</div>
        <div class="cell">棧板</div><div class="cell">{{ r.pallet }}</div>
        </div>
    {% endfor %}
</div>

<script>
    // 初始化簽名板
    const canvas = document.getElementById('signature-pad');
    const signaturePad = new SignaturePad(canvas);

    // 表單提交前，將簽名轉為圖片字串存入隱藏欄位
    document.getElementById('entryForm').addEventListener('submit', function (e) {
        if (signaturePad.isEmpty()) {
            alert("請司機完成簽名後再提交！");
            e.preventDefault();
        } else {
            const dataUrl = signaturePad.toDataURL();
            document.getElementById('signature_data').value = dataUrl;
        }
    });
</script>

</body>
</html>
